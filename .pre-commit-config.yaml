repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.36.0
    hooks:
      - id: markdownlint-fix-docker
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
  - repo: local
    hooks:
      - id: no-automode-in-claude-settings
        name: Block autoMode key in package/claude/settings.json
        description: >-
          Claude Code's auto mode writes project-specific learned context
          (org name, secrets locations, protected branches, etc.) into the
          global settings.json. That data belongs in the target project's
          own .claude/settings.local.json, not in this dotfiles repo.
        entry: >-
          bash -c 'jq -e ".autoMode // empty" "$1" >/dev/null 2>&1 &&
          { echo "package/claude/settings.json contains an autoMode key -
          strip it (it holds another project'"'"'s learned context) before
          committing"; exit 1; } || exit 0' --
        language: system
        files: ^package/claude/settings\.json$
